<mat-sidenav-container class="shell-container" [autosize]="true" [dir]="direction()">

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <mat-sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="sidenavOpened()" (openedChange)="onSidenavOpenedChange($event)" [fixedInViewport]="true"
    [disableClose]="!isMobile()" class="app-sidenav" [class.collapsed]="!isMobile() && sidebarCollapsed()">
    <app-sidebar [collapsed]="!isMobile() && sidebarCollapsed()" (navItemClicked)="isMobile() && closeSidenav()" />
  </mat-sidenav>

  <!-- ── Main content ────────────────────────────────────────────────── -->
  <mat-sidenav-content class="shell-content">

    <app-topnav (menuClick)="toggleSidebar()" />

    <main class="page-area">
      <router-outlet />
    </main>

    <!-- Mobile bottom navigation -->
    @if (isMobile()) {
    <nav class="bottom-nav" [attr.aria-label]="'SHELL.MAIN_NAV_ARIA' | translate">
      <a class="bottom-nav-item" routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span>{{ 'SHELL.DASHBOARD' | translate }}</span>
      </a>
      <a class="bottom-nav-item" routerLink="/calendar" routerLinkActive="active">
        <mat-icon>calendar_month</mat-icon>
        <span>{{ 'SHELL.CALENDAR' | translate }}</span>
      </a>
      <a class="bottom-nav-item" routerLink="/reservations" routerLinkActive="active">
        <mat-icon>event_available</mat-icon>
        <span>{{ 'SHELL.BOOKINGS' | translate }}</span>
      </a>
      <a class="bottom-nav-item" routerLink="/resources" routerLinkActive="active">
        <mat-icon>hotel</mat-icon>
        <span>{{ 'SHELL.RESOURCES' | translate }}</span>
      </a>
      <a class="bottom-nav-item" routerLink="/settings" routerLinkActive="active">
        <mat-icon>settings</mat-icon>
        <span>{{ 'SHELL.SETTINGS' | translate }}</span>
      </a>
    </nav>
    }

  </mat-sidenav-content>

</mat-sidenav-container>

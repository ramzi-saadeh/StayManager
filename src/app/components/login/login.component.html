<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>{{ 'LOGIN.TITLE' | translate }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                <mat-form-field appearance="outline">
                    <mat-label>{{ 'LOGIN.EMAIL' | translate }}</mat-label>
                    <input matInput formControlName="email" type="email" placeholder="email@example.com">
                    <mat-icon matPrefix>email</mat-icon>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>{{ 'LOGIN.PASSWORD' | translate }}</mat-label>
                    <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password">
                    <mat-icon matPrefix>lock</mat-icon>
                    <button mat-icon-button matSuffix (click)="hidePassword.set(!hidePassword())" type="button">
                        <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid || isLoading()"
                    class="submit-button">
                    @if (isLoading()) {
                    <mat-icon class="loading-icon">autorenew</mat-icon>
                    }
                    {{ 'LOGIN.SUBMIT' | translate }}
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
